name: Monitor Austin City Council Meetings

on:
  schedule:
    # Run twice daily: 8 AM and 6 PM Central Time (2 PM and 12 AM UTC)
    - cron: '0 14,0 * * *'
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: write  # Allow workflow to commit changes

jobs:
  check-meetings:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 google-generativeai
    
    - name: Run meeting scraper
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python austin_meeting_monitor_gemini.py
    
    - name: Generate GitHub Pages site
      run: |
        python github_pages_publisher.py
    
    - name: Commit and push updates
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/ austin_meetings.db
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: $(date)" && git push)
    
    - name: Upload database artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: meeting-database
        path: austin_meetings.db
        retention-days: 90

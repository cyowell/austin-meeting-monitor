name: Monitor Austin City Council Meetings

on:
  schedule:
    # Run twice daily: 8 AM and 6 PM Central Time (2 PM and 12 AM UTC)
    - cron: '0 14,0 * * *'
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: write  # Allow workflow to commit changes

jobs:
  check-meetings:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt
    
    - name: Run meeting scraper
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python3 austin_meeting_monitor_gemini.py

    - name: Send email alerts
      env:
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      run: |
        python3 email_sender.py
    
    - name: Generate GitHub Pages site
      run: |
        python3 github_pages_publisher.py
    
    - name: Export JSON Archives
      run: |
        python3 export_meetings_json.py

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build Astro Archives
      run: |
        cd archives
        npm install
        npm run build
    
    - name: Commit and push updates
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/ austin_meetings.db
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Auto-update: $(date)"
          git push
        fi
    
    - name: Upload database artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: meeting-database
        path: austin_meetings.db
        retention-days: 90

    <!-- Entablature / Architrave beam under pediment -->
    <rect x="116" y="218" width="280" height="24" rx="4" ry="4" />
    
    <!-- 4 Columns -->
    <!-- Column 1 -->
    <rect x="146" y="246" width="28" height="126" rx="4" ry="4" />
    <!-- Column 2 -->
    <rect x="211" y="246" width="28" height="126" rx="4" ry="4" />
    <!-- Column 3 -->
    <rect x="273" y="246" width="28" height="126" rx="4" ry="4" />
    <!-- Column 4 -->
    <rect x="338" y="246" width="28" height="126" rx="4" ry="4" />
    
    <!-- Stepped Foundation (Upper Step) -->
    <rect x="126" y="374" width="260" height="20" rx="3" ry="3" />
    <!-- Stepped Foundation (Base Step) -->
    <rect x="108" y="396" width="296" height="22" rx="4" ry="4" />
